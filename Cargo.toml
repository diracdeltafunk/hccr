[package]
name = "hccr"
version = "0.1.0"
edition = "2024"
authors = ["Ben Spitz <diracdeltafunk@users.noreply.github.com>"]

[lib]
name = "hccr"
path = "src/lib.rs"

[dependencies]
bitvec = "1.0.1"
fcars = { version = "0.2.1", features = ["random"] }
either = "1.16.0"
gap-sys = { git = "https://github.com/diracdeltafunk/gap-sys", branch = "codex/features-for-hccr", optional = true }

[features]
groups = ["dep:gap-sys"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "s5_context"
harness = false
required-features = ["groups"]

[[example]]
name = "tr_S_3"
required-features = ["groups"]

[[example]]
name = "tr_C_4"
required-features = ["groups"]

[[example]]
name = "count_tr_S_5"
required-features = ["groups"]

[[example]]
name = "rubin_functors"
required-features = ["groups"]
